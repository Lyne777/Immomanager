name: Docker Build & Push

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: meine-immobilien-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Code auschecken
        uses: actions/checkout@v7

      - name: Bei GitHub Container Registry anmelden
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v4

      # ghcr.io verlangt einen Image-Namen in Kleinschreibung - github.repository_owner kann aber
      # Großbuchstaben enthalten (z. B. bei manchen Orgs/Usernamen), daher hier explizit umwandeln,
      # statt das rohe github.repository_owner direkt im Tag zu verwenden.
      - name: Image-Owner in Kleinschreibung ermitteln
        run: echo "IMAGE_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Image bauen und veröffentlichen
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
